<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..500&family=Noto+Sans+Thai:wght@400;500&family=Noto+Sans+Hebrew:wght@400;500&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&display=block&text=%%SCTEXT%%">
<style>
  :root {
    /* njct.io's wall: the desktop grey and its soft radial light (index.html --ground), darker on a phone (crate groundGain) */
    --wall: rgb(220 220 220);
    --ground: radial-gradient(120% 60% at 50% 80%, rgb(211 211 211), rgb(216 216 216) 45%, rgb(220 220 220) 100%) rgb(220 220 220);
    --ink: #000;
    --ink-soft: rgba(0, 0, 0, 0.6);
    --pill-light: rgba(255, 255, 255, 0.7);
    --rule: rgba(0, 0, 0, 0.1);
    --gutter: 16px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --face: 'Inter', 'Noto Sans Thai', 'Noto Sans Hebrew', 'Noto Sans SC', sans-serif;
  }
  @media (max-width: 599px) {
    :root {
      --wall: rgb(204 204 204);
      --ground: radial-gradient(130% 55% at 50% 85%, rgb(195.5 195.5 195.5), rgb(200.5 200.5 200.5) 45%, rgb(204.8 204.8 204.8) 100%) rgb(204.8 204.8 204.8);
    }
  }
  html { background: var(--ground); overflow-x: clip; }
  body {
    margin: 0; min-height: 100dvh; overflow-x: clip; background: transparent;
    font: 400 16px/22px var(--face); color: var(--ink);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; margin: 0; }
  :focus-visible { outline: 2px solid #000; outline-offset: 2px; }

  /* The room: one column on the wall; the café's sun falls across it from the street window on the right. */
  .page {
    position: relative; box-sizing: border-box; max-width: 430px; min-height: 100dvh; margin: 0 auto;
    padding: 0 var(--gutter) calc(20px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
  }
  .sun { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .sun.wall { z-index: 0; }
  .page > :not(.sun) { position: relative; z-index: 1; }

  /* The light comes in through the window: the one motion on load. */
  .move { animation: sun-in 2.4s cubic-bezier(0.2, 0.6, 0.15, 1) 0.15s both; }
  @keyframes sun-in { from { opacity: 0; transform: translate(70px, -18px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .move { animation: none; } }
  .still .move { animation: none; }

  /* The header, as njct.io's: the wordmark, and the language picker built as the Projects menu. */
  .mast { position: relative; height: 54px; margin: 0 calc(-1 * var(--gutter)); z-index: 3 !important; }
  .wordmark {
    position: absolute; inset-inline-start: var(--gutter); top: 5px; padding: 12px 0; min-width: 44px;
    font-weight: 500; line-height: 20px; color: var(--ink); text-decoration: none; font-family: 'Inter', sans-serif;
  }
  .pm { position: absolute; top: 5px; inset-inline-start: calc(var(--gutter) + 82px); }
  .pm-btn {
    display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; border: 0; border-radius: 4px;
    background: transparent; color: var(--ink); font-weight: 500; line-height: 16px; letter-spacing: -0.01em; cursor: pointer;
    transition: color 0.3s var(--ease), background-color 0.3s var(--ease);
  }
  @media (hover: hover) { .pm-btn:hover { background: #000; color: #fff; } .pm-list a:hover { background: rgb(244 244 244); } }
  .pm-btn svg { width: 16px; height: 16px; display: block; transition: transform 0.3s var(--ease); }
  .pm.open .pm-btn svg { transform: rotate(180deg); }
  .pm-list {
    position: absolute; inset-inline-start: 0; top: calc(100% + 8px); margin: 0; padding: 0; list-style: none; box-sizing: border-box;
    min-width: 220px; background: #fff; border-radius: 4px;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
    opacity: 0; visibility: hidden; translate: 0 -10px;
    transition: opacity 0.3s var(--ease), visibility 0.3s var(--ease), translate 0.3s var(--ease);
  }
  .pm.open .pm-list { opacity: 1; visibility: visible; translate: none; transition: opacity 0.3s var(--ease) 0.1s, visibility 0s, translate 0.3s var(--ease) 0.1s; }
  .pm.instant .pm-list { transition: none; }
  .pm-list li { border-bottom: 1px solid rgb(236 236 236); }
  .pm-list li:last-child { border-bottom: 0; }
  .pm-list a {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 0 12px;
    box-sizing: border-box; color: #000; text-decoration: none; font-size: 16px; line-height: 20px;
  }
  .pm-list a:focus-visible { outline-offset: -2px; }
  .pm-list svg { width: 16px; height: 16px; flex: none; visibility: hidden; }
  .pm-list a[aria-current="true"] svg { visibility: visible; }
  /* A phone: the list is a sheet from the bottom of the screen, as the Projects menu is. */
  @media (max-width: 599px) {
    .pm-list {
      position: fixed; left: 0; right: 0; top: auto; bottom: 0; min-width: 0; border-radius: 4px 4px 0 0;
      padding-bottom: env(safe-area-inset-bottom); translate: 0 50px;
    }
    .pm-list a { min-height: 52px; padding: 0 var(--gutter); font-size: 17px; }
  }

  /* The sleeve, off the shelf and held up: the About Neil cover. */
  .sleeve {
    --s: min(320px, calc(100vw - 2 * var(--gutter) - 40px), 39dvh);
    position: relative; width: var(--s); height: var(--s); margin: 18px auto 0; flex: none;
    overflow: hidden; background: #EFE2CC;
    box-shadow: 0 0 0 0.5px rgba(74, 50, 18, 0.18), 0 18px 34px -22px rgba(0, 0, 0, 0.45);
  }
  .sleeve svg { position: absolute; display: block; }
  .sleeve .art { inset: 0; width: 100%; height: 100%; }
  .sleeve .sun { opacity: 0.55; mix-blend-mode: soft-light; }
  /* the sleeve's card edge catches the light along its top, as the crate's sleeves do */
  .sleeve::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -1px 0 rgba(74, 50, 18, 0.12); }

  .hello { margin-top: 34px; }
  h1 {
    margin: 0; font-size: 44px; line-height: 48px; font-weight: 500; letter-spacing: -0.025em; text-wrap: balance;
  }
  :lang(th) h1 { font-size: 36px; line-height: 50px; letter-spacing: 0; }
  :lang(zh) h1 { font-size: 40px; line-height: 50px; letter-spacing: 0; }
  :lang(he) h1 { letter-spacing: -0.01em; }
  .line { margin: 10px 0 0; max-width: 32ch; font-size: 17px; line-height: 25px; color: var(--ink-soft); text-wrap: pretty; }
  :lang(th) .line { line-height: 28px; }

  /* The channels, as the site's pills: black first (Open), light after (Details). */
  .channels { display: flex; flex-wrap: wrap; gap: 10px 8px; margin-top: 26px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; box-sizing: border-box; height: 44px; padding: 0 18px 0 15px;
    border-radius: 22px; background: var(--pill-light); color: var(--ink); text-decoration: none; white-space: nowrap; padding-inline: 15px 18px;
    font-family: 'Inter', sans-serif; font-size: 16px; line-height: 44px;
    transition: background-color 0.2s var(--ease), color 0.2s var(--ease);
  }
  .pill svg { width: 18px; height: 18px; flex: none; display: block; }
  .pill.lead { background: #000; color: #fff; }
  @media (hover: hover) { .pill:not(.lead):hover { background: #fff; } .pill.lead:hover { background: #222; } }
  .pill:active { scale: 0.98; }

  .foot { margin-top: auto; padding-top: 28px; }
  .foot-in { display: flex; justify-content: flex-end; padding-top: 14px; border-top: 1px solid var(--rule); }
  .foot .pill { font-family: var(--face); }

  @media (max-height: 700px) { .hello { margin-top: 26px; } .channels { margin-top: 20px; } }
  @media (min-width: 600px) { .mast { margin: 8px 0 0; } .sleeve { margin-top: 40px; } .foot { padding-bottom: 24px; } }
</style>
</head>
<body>
<div class="page" id="page">
  <svg class="sun wall" id="sun-wall" viewBox="0 0 390 844" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <!-- the window's light: three lights below the transom and three above, the glazing bars and the leaves cutting it -->
      <linearGradient id="sun-c" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="420" y2="0">
        <stop offset="0" stop-color="rgb(255 222 184)" stop-opacity="0.7"/>
        <stop offset="1" stop-color="rgb(255 220 178)" stop-opacity="0.86"/>
      </linearGradient>
      <filter id="pen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>
      <filter id="leafblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter>
      <filter id="shadeblur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
      <mask id="window" maskUnits="userSpaceOnUse" x="-300" y="-300" width="1600" height="1600">
        <g filter="url(#pen)">
          <!-- the opening: vertical sides, the head and sill falling to the left with the low sun -->
          <polygon points="20,116 900,-113 900,527 20,756" fill="#fff"/>
          <!-- the glazing bars, full height -->
          <polygon points="356,-200 364,-200 364,1000 356,1000" fill="#000"/>
          <polygon points="640,-200 648,-200 648,1000 640,1000" fill="#000"/>
          <!-- the transom, three lights above it -->
          <polygon points="0,496 900,262 900,272 0,506" fill="#000"/>
        </g>
        <g filter="url(#leafblur)" fill="#000">
          <path d="%%BLADES%%"/>
          <path d="%%RIBS%%" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
        </g>
      </mask>
      <g id="light"><rect x="-300" y="-300" width="1600" height="1600" fill="url(#sun-c)" mask="url(#window)"/></g>
      <!-- the held sleeve stands off the wall and takes its square of light away, to the lower left -->
      <mask id="sleeve-shade" maskUnits="userSpaceOnUse" x="-300" y="-300" width="1600" height="1600">
        <rect x="-300" y="-300" width="1600" height="1600" fill="#fff"/>
        <rect id="shade" x="0" y="0" width="0" height="0" fill="#000" filter="url(#shadeblur)"/>
      </mask>
    </defs>
    <g mask="url(#sleeve-shade)"><use href="#light" class="move"/></g>
  </svg>

  <header class="mast">
    <a class="wordmark" href="#"><span dir="ltr">njct.io</span></a>
    <div class="pm" id="pm">
      <button class="pm-btn" id="pm-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="pm-list"><span id="pm-label">English</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
      <ul class="pm-list" id="pm-list" aria-labelledby="pm-btn"></ul>
    </div>
  </header>

  <figure class="sleeve" id="sleeve" style="margin-inline:auto" aria-label="Neil">
    <svg class="art" viewBox="0 0 1024 1024" aria-hidden="true">
      <defs>
        <radialGradient id="paper" gradientUnits="userSpaceOnUse" cx="492" cy="512" r="760">
          <stop offset="0.1" stop-color="#F2E7D3"/><stop offset="0.85" stop-color="#E8D8BC"/>
        </radialGradient>
        <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="252">
          <stop offset="0" stop-color="#D2A64E"/><stop offset="0.35" stop-color="#C99A41"/><stop offset="1" stop-color="#A8771F"/>
        </linearGradient>
        <!-- the sphere, matte satin, the key from the upper right (MOTIFS.about) -->
        <radialGradient id="sph" gradientUnits="userSpaceOnUse" cx="640" cy="430" r="560">
          <stop offset="0" stop-color="#F0B654"/><stop offset="0.2" stop-color="#E49A38"/><stop offset="0.48" stop-color="#D2802A"/>
          <stop offset="0.76" stop-color="#B9681E"/><stop offset="1" stop-color="#A35A1A"/>
        </radialGradient>
        <radialGradient id="core" gradientUnits="userSpaceOnUse" cx="330" cy="560" r="260">
          <stop offset="0" stop-color="#6E340A" stop-opacity="0.24"/><stop offset="0.55" stop-color="#6E340A" stop-opacity="0.12"/><stop offset="1" stop-color="#6E340A" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bounce" gradientUnits="userSpaceOnUse" cx="330" cy="830" r="250">
          <stop offset="0" stop-color="#E9A04F" stop-opacity="0.75"/><stop offset="1" stop-color="#E9A04F" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="foot" gradientUnits="userSpaceOnUse" x1="0" y1="700" x2="0" y2="846">
          <stop offset="0" stop-color="#5A2A04" stop-opacity="0"/><stop offset="1" stop-color="#5A2A04" stop-opacity="0.45"/>
        </linearGradient>
        <filter id="soft6"><feGaussianBlur stdDeviation="6"/></filter>
        <filter id="soft14" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="14"/></filter>
        <filter id="soft26" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="26"/></filter>
        <clipPath id="ball"><circle cx="491" cy="589" r="256"/></clipPath>
      </defs>
      <rect width="1024" height="1024" fill="url(#paper)"/>
      <!-- contact shadow, cast to the left: a warm penumbra, a wider fall, a near-black core at the foot -->
      <ellipse cx="350" cy="842" rx="300" ry="40" fill="#A2621F" opacity="0.26" filter="url(#soft26)"/>
      <ellipse cx="430" cy="846" rx="220" ry="22" fill="#3A2008" opacity="0.42" filter="url(#soft14)"/>
      <ellipse cx="478" cy="846" rx="118" ry="9" fill="#1E0F02" opacity="0.6" filter="url(#soft6)"/>
      <g id="head">
        <circle cx="491" cy="589" r="256" fill="url(#sph)"/>
        <g clip-path="url(#ball)">
          <rect x="230" y="330" width="520" height="520" fill="url(#core)"/>
          <circle cx="330" cy="830" r="250" fill="url(#bounce)"/>
          <rect x="230" y="700" width="520" height="150" fill="url(#foot)"/>
        </g>
      </g>
      <path d="%%NEIL%%" fill="url(#gold)" fill-rule="evenodd"/>
    </svg>
    <svg class="sun" id="sun-sleeve" viewBox="0 0 390 844" preserveAspectRatio="none" aria-hidden="true"><use href="#light" class="move"/></svg>
  </figure>

  <section class="hello">
    <h1 id="greet">Hi, I’m Neil.</h1>
    <p class="line" id="line">Great to meet you. Here's where to find me.</p>
  </section>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <mask id="m-li" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18"><rect width="18" height="18" fill="#fff"/><g fill="#000"><rect x="4.6" y="7.4" width="2.2" height="6.2"/><circle cx="5.7" cy="5.2" r="1.3"/><path d="M8.6 7.4h2.1v.9c.4-.7 1.2-1.1 2.1-1.1 1.6 0 2.4 1 2.4 2.8v3.6H13v-3.3c0-.9-.3-1.4-1.1-1.4-.8 0-1.2.6-1.2 1.4v3.3H8.6z"/></g></mask>
    <mask id="m-line" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18"><rect width="18" height="18" fill="#fff"/><g fill="#000"><rect x="4.4" y="6" width="1.2" height="4" rx=".4"/><rect x="4.4" y="8.9" width="2.6" height="1.1" rx=".4"/><rect x="7.7" y="6" width="1.2" height="4" rx=".4"/><path d="M9.8 6h1.1l1.6 2.3V6h1.1v4h-1.1l-1.6-2.3V10H9.8z"/></g></mask>
    <mask id="m-wc" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18"><rect width="18" height="18" fill="#fff"/><g fill="#000"><circle cx="5.1" cy="6" r=".85"/><circle cx="8.9" cy="6" r=".85"/></g></mask>
  </defs></svg>
  <nav class="channels" id="channels" aria-label="LinkedIn, WhatsApp, LINE, WeChat">
    <a class="pill" href="#" data-ch="linkedin"><svg viewBox="0 0 18 18" aria-hidden="true"><rect x="1.5" y="1.5" width="15" height="15" rx="3" fill="currentColor" mask="url(#m-li)"/></svg>LinkedIn</a>
    <a class="pill" href="#" data-ch="whatsapp"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1.9a7 7 0 0 0-6 10.6L2 16.1l3.7-1A7 7 0 1 0 9 1.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.6 5.6c.2-.2.5-.2.7 0l.8 1.3c.1.2.1.5-.1.7l-.5.5c.4.9 1.2 1.7 2.1 2.1l.5-.5c.2-.2.5-.2.7-.1l1.3.8c.2.1.3.5.1.7l-.5.7c-.3.4-.9.5-1.4.3-2-.8-3.6-2.4-4.4-4.4-.2-.5-.1-1.1.3-1.4z" fill="currentColor"/></svg>WhatsApp</a>
    <a class="pill" href="#" data-ch="line"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2C4.9 2 1.6 4.6 1.6 7.9c0 2.9 2.6 5.4 6.2 5.8.3.1.5.4.4.7l-.2 1.3c-.1.4.3.7.7.5 2.7-1.4 7.7-4.4 7.7-8.3C16.4 4.6 13.1 2 9 2z" fill="currentColor" mask="url(#m-line)"/></svg>LINE</a>
    <a class="pill" href="#" data-ch="wechat"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M7 2.4C3.9 2.4 1.4 4.5 1.4 7.1c0 1.5.8 2.8 2.1 3.7l-.5 1.7 2-1.1c.6.2 1.3.3 2 .3h.4a4.6 4.6 0 0 1-.2-1.3c0-2.6 2.5-4.7 5.6-4.7h.3C12.5 3.8 10 2.4 7 2.4z" fill="currentColor" mask="url(#m-wc)"/><path d="M12.4 7.6c-2.6 0-4.6 1.7-4.6 3.8s2 3.8 4.6 3.8c.5 0 1-.1 1.5-.2l1.6.9-.4-1.4c1.1-.7 1.8-1.8 1.8-3.1 0-2.1-2-3.8-4.5-3.8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10.9" cy="10.6" r=".7" fill="currentColor"/><circle cx="13.9" cy="10.6" r=".7" fill="currentColor"/></svg>WeChat</a>
  </nav>

  <footer class="foot">
    <div class="foot-in">
      <a class="pill" href="#" id="save"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="6.2" r="3"/><path d="M2.2 15.5c.6-2.7 2.7-4.4 5.3-4.4 1.1 0 2.1.3 2.9.8M13.5 10.5v5M11 13h5"/></svg><span id="save-t">Save contact</span></a>
    </div>
  </footer>
</div>

<script>
(() => {
  const L = {
    en: { name: 'English', greet: 'Hi, I’m Neil.', line: "Great to meet you. Here's where to find me.", save: 'Save contact', order: ['linkedin', 'whatsapp', 'line', 'wechat'] },
    th: { name: 'ไทย', greet: 'สวัสดีครับ ผม Neil', line: 'ยินดีที่ได้รู้จักครับ ติดต่อผมได้ทางนี้', save: 'บันทึกรายชื่อ', order: ['line', 'whatsapp', 'linkedin', 'wechat'] },
    zh: { name: '中文', greet: '你好，我是 Neil', line: '很高兴认识你，可以在这里找到我。', save: '保存联系人', order: ['wechat', 'linkedin', 'whatsapp', 'line'] },
    he: { name: 'עברית', greet: 'היי, אני ניל', line: 'נעים להכיר! כאן אפשר למצוא אותי.', save: 'שמירת איש קשר', order: ['whatsapp', 'linkedin', 'line', 'wechat'] },
    es: { name: 'Español', greet: '¡Hola! Soy Neil.', line: 'Encantado de conocerte. Aquí me encuentras.', save: 'Guardar contacto', order: ['whatsapp', 'linkedin', 'line', 'wechat'] },
  };
  const NAMES = { linkedin: 'LinkedIn', whatsapp: 'WhatsApp', line: 'LINE', wechat: 'WeChat' };
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement, pm = $('pm'), btn = $('pm-btn'), list = $('pm-list'), chans = $('channels');
  const check = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  list.innerHTML = Object.entries(L).map(([k, v]) => `<li><a href="?lang=${k}" data-lang="${k}"><span lang="${k === 'zh' ? 'zh-Hans' : k}" dir="auto">${v.name}</span>${check}</a></li>`).join('');

  let cur = 'en';
  function setLang(k) {
    if (!L[k]) k = 'en';
    cur = k; const v = L[k];
    root.lang = k === 'zh' ? 'zh-Hans' : k;
    root.dir = k === 'he' ? 'rtl' : 'ltr';
    $('pm-label').textContent = v.name;
    $('greet').textContent = v.greet; $('line').textContent = v.line; $('save-t').textContent = v.save;
    v.order.forEach((c, i) => { const a = chans.querySelector(`[data-ch="${c}"]`); a.classList.toggle('lead', i === 0); chans.append(a); });
    chans.setAttribute('aria-label', v.order.map((c) => NAMES[c]).join(', '));
    list.querySelectorAll('a').forEach((a) => a.setAttribute('aria-current', a.dataset.lang === k ? 'true' : 'false'));
    const u = new URL(location.href); u.searchParams.set('lang', k); u.searchParams.delete('picker'); u.searchParams.delete('still');
    try { history.replaceState(null, '', u); } catch {}
    place();
  }
  function open(on) { pm.classList.toggle('open', on); btn.setAttribute('aria-expanded', on); }
  btn.addEventListener('click', () => open(!pm.classList.contains('open')));
  list.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-lang]'); if (!a) return;
    e.preventDefault(); setLang(a.dataset.lang); open(false); btn.focus();
  });
  document.addEventListener('click', (e) => { if (!pm.contains(e.target)) open(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && pm.classList.contains('open')) { open(false); btn.focus(); } });

  // The sun is drawn once in the page's frame; the sleeve takes the same light (at the cover's gain), and
  // its own square of shadow falls on the wall to the lower left.
  const page = $('page'), sleeve = $('sleeve'), inner = $('sun-sleeve'), shade = $('shade');
  function place() {
    const W = page.offsetWidth, H = page.offsetHeight, x = sleeve.offsetLeft, y = sleeve.offsetTop, s = sleeve.offsetWidth;
    Object.assign(inner.style, { left: -x + 'px', top: -y + 'px', width: W + 'px', height: H + 'px' });
    const sx = 390 / W, sy = 844 / H;
    shade.setAttribute('x', (x - 30) * sx); shade.setAttribute('y', (y + 12) * sy);
    shade.setAttribute('width', s * sx); shade.setAttribute('height', s * sy);
  }
  addEventListener('resize', place);
  document.fonts?.ready.then(place);

  const q = new URLSearchParams(location.search);
  if (q.has('still')) root.classList.add('still');
  setLang(q.get('lang') || 'en');
  if (q.get('picker') === 'open') { pm.classList.add('instant'); open(true); requestAnimationFrame(() => requestAnimationFrame(() => pm.classList.remove('instant'))); }
})();
</script>
</body>
</html>
