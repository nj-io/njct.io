<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neil, njct.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Anuphan:wght@400..600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Playpen+Sans:wght@300..500&family=Playpen+Sans+Thai:wght@300..500&family=Playpen+Sans+Hebrew:wght@300..500&family=Long+Cang&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#D3D8DF;        /* sorting-office grey */
  --card:#FFFFFF;        /* postcard board */
  --red:#D3202F;         /* airmail / pillar-box red */
  --blue:#1A4A9A;        /* par avion blue */
  --ink:#1C2A4C;         /* fountain-pen blue-black */
  --carmine:#B8182B;     /* engraved stamp */
  --cancel:#2A2D33;      /* postmark ink */
  --rule:#A7B1C2;        /* address-line rule */

  --latin:"Archivo", system-ui, sans-serif;
  --hand:"Playpen Sans", cursive;
}
html:lang(th){ --latin:"Anuphan","Archivo",sans-serif; --hand:"Playpen Sans Thai","Playpen Sans",cursive; }
html:lang(he){ --latin:"IBM Plex Sans Hebrew","Archivo",sans-serif; --hand:"Playpen Sans Hebrew","Playpen Sans",cursive; }
html:lang(zh){ --latin:"Noto Sans SC","Archivo",sans-serif; --hand:"Playpen Sans","Long Cang",cursive; }

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--desk);
  color:var(--ink);
  font-family:var(--latin);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  min-height:100svh;
  display:flex;
  justify-content:center;
  padding:10px;
}

/* airmail envelope edge: the chevron band is the card's own border */
.envelope{
  width:100%;
  max-width:440px;
  min-height:calc(100svh - 20px);
  padding:9px;
  background:repeating-linear-gradient(135deg,
      var(--red) 0 11px, var(--card) 11px 17px,
      var(--blue) 17px 28px, var(--card) 28px 34px);
  box-shadow:0 1px 0 rgba(30,40,60,.18), 0 10px 26px -14px rgba(30,40,60,.45);
}
.card{
  position:relative;
  background:var(--card);
  min-height:100%;
  overflow:hidden;
  padding:16px 18px 26px;
  display:flex;
  flex-direction:column;
}

/* ---------- top: picker, stamp, postmark ---------- */
.top{position:relative;height:206px;flex:none}

.stamp{
  position:absolute;inset-block-start:0;inset-inline-end:0;
  width:150px;height:180px;padding:8px;
  background:radial-gradient(circle at 5px 5px, transparent 3.6px, #fff 4px) -5px -5px / 10px 10px;
  filter:drop-shadow(0 1px .5px rgba(30,40,60,.35)) drop-shadow(0 3px 5px rgba(30,40,60,.12));
  transform:rotate(1.4deg);
}
[dir=rtl] .stamp{transform:rotate(-1.4deg)}
[dir=rtl] #portrait{transform:scaleX(-1);transform-box:view-box;transform-origin:67px 0}
.stamp svg{display:block;width:134px;height:164px;background:#fff}

.mark{
  position:absolute;
  inset-block-start:96px;inset-inline-end:118px;
  width:104px;height:104px;
  direction:ltr;
  color:var(--cancel);
  mix-blend-mode:multiply;
  opacity:.82;
  transform:rotate(-9deg);
  pointer-events:none;
}
.mark text{font-family:"Archivo",sans-serif;font-weight:600;font-stretch:88%;font-size:11.5px;letter-spacing:1.6px;fill:currentColor}
.waves{
  position:absolute;
  inset-block-start:117px;inset-inline-end:206px;
  width:240px;height:62px;
  color:var(--cancel);mix-blend-mode:multiply;opacity:.72;
  pointer-events:none;
}
[dir=rtl] .waves{transform:scaleX(-1)}

@media (prefers-reduced-motion:no-preference){
  .mark{animation:thunk .42s cubic-bezier(.2,.9,.25,1.25) .5s both}
  .waves{animation:ink .3s ease-out .62s both}
  @keyframes thunk{
    0%{opacity:0;transform:rotate(-9deg) scale(1.35)}
    60%{opacity:.9}
    100%{opacity:.82;transform:rotate(-9deg) scale(1)}
  }
  @keyframes ink{from{opacity:0}to{opacity:.72}}
}

/* language picker: a red hand-stamp box */
.picker{position:absolute;inset-block-start:2px;inset-inline-start:0;z-index:5}
.picker > button{
  appearance:none;border:0;margin:0;cursor:pointer;
  min-height:44px;padding:0 12px 0 14px;
  display:flex;align-items:center;gap:10px;
  background:transparent;color:var(--red);
  font:600 16px/1 var(--latin);
  outline:2px solid var(--red);outline-offset:-2px;
  box-shadow:inset 0 0 0 4px #fff, inset 0 0 0 5px var(--red);
  border-radius:3px;
  transform:rotate(-2deg);
}
[dir=rtl] .picker > button{transform:rotate(2deg)}
.picker > button svg{width:12px;height:8px;transition:transform .15s}
.picker.open > button svg{transform:rotate(180deg)}
.picker > button:focus-visible{outline-color:var(--blue)}

.sheet{
  position:absolute;inset-block-start:56px;inset-inline-start:-4px;
  width:208px;margin:0;padding:10px 0 6px;list-style:none;
  background:
    radial-gradient(circle at 5px 0, transparent 3.6px, #fff 4px) -5px 0 / 10px 10px repeat-x,
    linear-gradient(#fff,#fff) 0 5px / 100% calc(100% - 5px) no-repeat;
  filter:drop-shadow(0 1px .5px rgba(30,40,60,.4)) drop-shadow(0 8px 14px rgba(30,40,60,.2));
  display:none;
}
.picker.open .sheet{display:block}
.sheet button{
  appearance:none;border:0;background:transparent;cursor:pointer;
  width:100%;min-height:48px;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  color:var(--ink);font-size:19px;text-align:start;
}
.sheet li + li button{box-shadow:inset 0 1px 0 #E3E7ED}
.sheet button[aria-checked=true]{color:var(--red)}
.sheet button svg{width:20px;height:16px;visibility:hidden}
.sheet button[aria-checked=true] svg{visibility:visible}
.sheet button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.sheet [data-l=en]{font-family:"Archivo",sans-serif}
.sheet [data-l=th]{font-family:"Anuphan",sans-serif}
.sheet [data-l=zh]{font-family:"Noto Sans SC",sans-serif}
.sheet [data-l=he]{font-family:"IBM Plex Sans Hebrew",sans-serif}
.sheet [data-l=es]{font-family:"Archivo",sans-serif}

/* ---------- message ---------- */
.sp{flex:1 0 0;max-height:28px}
.sp:last-of-type{max-height:none}
.msg{padding:10px 2px 0}
h1{
  margin:0;
  font-family:var(--hand);
  font-weight:400;
  font-size:50px;line-height:1.08;
  color:var(--ink);
  letter-spacing:-.01em;
  transform:rotate(-1.2deg);transform-origin:0 50%;
}
[dir=rtl] h1{transform:rotate(1.2deg);transform-origin:100% 50%}
html:lang(th) h1{font-size:36px;line-height:1.3}
html:lang(zh) h1{font-size:42px;line-height:1.2;font-weight:300}
.line{
  margin:14px 0 0;
  font-size:18px;line-height:1.45;
  font-stretch:96%;
  max-width:30ch;
  text-wrap:pretty;
  color:#2C3A5A;
}
html:lang(th) .line{font-size:18px;line-height:1.6}

/* ---------- address lines = channels ---------- */
.to{list-style:none;margin:26px 0 0;padding:0}
.to a{
  display:flex;align-items:center;gap:14px;
  min-height:60px;padding:14px 4px 8px;
  color:var(--ink);text-decoration:none;
  font-family:"Archivo",sans-serif;font-weight:500;font-size:20px;font-stretch:94%;
  border-bottom:1.5px solid var(--rule);
}
.to li:first-child a{border-top:0}
.to a svg{width:26px;height:26px;flex:none;color:var(--blue)}
.to a:active{background:#F1F4F8}
.to a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- save: par avion label ---------- */
.save{
  align-self:flex-start;
  margin-top:30px;
  appearance:none;border:0;cursor:pointer;
  min-height:56px;padding:0 22px 0 18px;
  display:inline-flex;align-items:center;gap:12px;
  background:var(--blue);color:#fff;
  font:600 18px/1 var(--latin);
  box-shadow:inset 0 0 0 4px var(--blue), inset 0 0 0 5.5px #fff, 0 1px 1px rgba(20,30,60,.3);
  border-radius:2px;
  transform:rotate(-1.6deg);
}
[dir=rtl] .save{transform:rotate(1.6deg)}
.save svg{width:22px;height:22px;flex:none}
.save:focus-visible{outline:3px solid var(--red);outline-offset:3px}

@media (min-width:600px){
  body{padding:40px 16px;align-items:flex-start}
  .envelope{min-height:0}
  .card{min-height:760px}
}
</style>
</head>
<body>
<div class="envelope">
<main class="card">

  <div class="top">
    <div class="picker" id="picker">
      <button type="button" id="pickBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="sheet">
        <span id="pickLabel">English</span>
        <svg viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <ul class="sheet" id="sheet" role="listbox"></ul>
    </div>

    <svg class="waves" viewBox="0 0 240 62" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M2 6c12-6 24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s12 4 18 2"/>
      <path d="M2 19c12-6 24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s12 4 18 2"/>
      <path d="M2 32c12-6 24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s12 4 18 2"/>
      <path d="M2 45c12-6 24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s12 4 18 2"/>
      <path d="M2 58c12-6 24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s24 6 36 0 s12 4 18 2"/>
    </svg>

    <!-- stamp: the vignette (#portrait) is the stage-2 avatar slot -->
    <div class="stamp">
      <svg viewBox="0 0 134 164" role="img" aria-label="Neil">
        <defs>
          <pattern id="engr" width="4" height="2.2" patternUnits="userSpaceOnUse">
            <rect width="4" height=".85" fill="#B8182B"/>
          </pattern>
          <clipPath id="vig"><rect x="9" y="9" width="116" height="124"/></clipPath>
          <path id="head" d="M44 124C44 112 43 103 44 96C38 94 32 91 30 87C27 84 27 80 28 78L26 75C27 73 26 72 25 71L26 69C24 67 23 66 24 64C20 63 17 61 18.5 58.5C20.5 55 23 51 25 47C25 44 25 41 26 38C28 26 40 17 55 17C71 17 82 29 82 46C82 58 77 66 73 72C71 80 71 90 73 100L77 124Z"/>
        </defs>
        <rect x="4.5" y="4.5" width="125" height="155" fill="none" stroke="#B8182B" stroke-width="1.2"/>
        <g id="portrait" clip-path="url(#vig)">
          <rect x="9" y="9" width="116" height="124" fill="url(#engr)"/>
          <g transform="translate(12 6) scale(1.1)">
            <use href="#head" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
            <use href="#head" fill="#B8182B"/>
            <g fill="none" stroke="#fff" stroke-linecap="round">
              <!-- hairline and hair -->
              <path d="M26.5 37C31 31.5 37 30 43 31.5C50 33.5 54 39 56 45.5C60 44.5 66 46 70 52C72 58 73 64 73.5 70" stroke-width="1.5"/>
              <path d="M32 29.5C40 22 54 20 66 26" stroke-width=".9"/>
              <path d="M40 30C49 25 62 26 72 34" stroke-width=".9"/>
              <path d="M48 32.5C58 30 70 35 77 45" stroke-width=".9"/>
              <path d="M55 38C64 37 73 43 79 53" stroke-width=".9"/>
              <path d="M66 46C71 49 75 54 78 61" stroke-width=".9"/>
              <!-- brow, eye, nostril, mouth -->
              <path d="M27.5 44.5C30 43 33 43 35.5 44" stroke-width="1.2"/>
              <path d="M28.5 49C30.5 48.2 32.5 48.4 34 49.4" stroke-width="1.3"/>
              <path d="M22.5 61.5C23.5 62.4 25 62.6 26 62" stroke-width="1"/>
              <path d="M26.5 71.2C28 71.6 29.5 71.4 30.5 70.8" stroke-width="1"/>
              <!-- ear -->
              <path d="M58 50C62 47 66 50 65.5 55C65 60 62 62 59 62" stroke-width="1.3"/>
              <path d="M60 53.5C61.5 53 62.6 54.4 62 56.4" stroke-width=".9"/>
              <!-- jaw and collar -->
              <path d="M31.5 86C40 87.5 50 84 56 76" stroke-width="1"/>
              <path d="M42 112C52 108 64 108 76 112" stroke-width="1.2"/>
            </g>
          </g>
        </g>
        <rect x="9" y="9" width="116" height="124" fill="none" stroke="#B8182B" stroke-width="1"/>
        <text x="67" y="152" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="600" font-size="13" fill="#B8182B" style="font-stretch:90%">njct.io</text>
      </svg>
    </div>

    <!-- postmark: the city is data (Cloudflare request.cf.city) -->
    <svg class="mark" viewBox="0 0 104 104" aria-hidden="true">
      <defs><path id="arc" d="M14 52a38 38 0 0 1 76 0"/></defs>
      <circle cx="52" cy="52" r="49" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <circle cx="52" cy="52" r="31" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text><textPath href="#arc" startOffset="50%" text-anchor="middle" id="city">LONDON</textPath></text>
      <!-- bottom arc ornaments -->
      <circle cx="30" cy="80" r="1.8" fill="currentColor"/>
      <circle cx="52" cy="89" r="1.8" fill="currentColor"/>
      <circle cx="74" cy="80" r="1.8" fill="currentColor"/>
      <!-- centre: aircraft -->
      <path fill="currentColor" d="M52 33.5c1.6 0 2.4 1.6 2.4 3.6v9.4l14.6 7.6v3.4l-14.6-4.2v8.4l4.6 3.4v2.8L52 66.6l-7 1.9v-2.8l4.6-3.4v-8.4L35 58.1v-3.4l14.6-7.6v-9.4c0-2 .8-3.6 2.4-3.6z"/>
    </svg>
  </div>
  <div class="sp"></div>

  <section class="msg">
    <h1 id="greet">Hi, I'm Neil.</h1>
    <p class="line" id="line">Great to meet you. Here's where to find me.</p>
  </section>
  <div class="sp"></div>

  <ul class="to" id="to">
    <li data-c="linkedin"><a href="#">
      <svg viewBox="0 0 26 26" aria-hidden="true"><rect x="1.5" y="1.5" width="23" height="23" rx="4" fill="currentColor"/><g fill="#fff"><rect x="6" y="10.2" width="3.3" height="9.8"/><circle cx="7.65" cy="6.9" r="1.95"/><path d="M11.8 10.2h3.1v1.4c.6-1 1.9-1.7 3.4-1.7 2.6 0 3.7 1.6 3.7 4.4V20h-3.3v-5.1c0-1.4-.4-2.3-1.7-2.3-1.4 0-1.9 1-1.9 2.4v5h-3.3z"/></g></svg>
      LinkedIn</a></li>
    <li data-c="whatsapp"><a href="#">
      <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 2.2A10.8 10.8 0 0 0 3.6 18.3L2.2 23.8l5.6-1.4A10.8 10.8 0 1 0 13 2.2z" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M9.6 7.6c.3 0 .6 0 .8.5l1.1 2.5c.1.3 0 .5-.1.7l-.8 1c-.1.2-.2.4 0 .6.9 1.6 2.1 2.8 3.7 3.6.2.1.4.1.6-.1l1-1.2c.2-.2.4-.3.7-.2l2.4 1.1c.3.1.5.3.4.7-.1 1.2-1.3 2.4-2.6 2.4-3.6 0-8.4-4.4-8.6-8.3 0-1.4 1-2.8 1.4-3.2z"/></svg>
      WhatsApp</a></li>
    <li data-c="line"><a href="#">
      <svg viewBox="0 0 26 26" aria-hidden="true"><path fill="currentColor" d="M13 2.5c6.1 0 11 3.9 11 8.8 0 4.4-4.4 8.1-9.8 10.4-1.3.6-2.5 1.6-3.1 1.6-.7 0 .3-1.7.3-2.6 0-.4-.3-.6-.8-.7C5.5 19.1 2 15.6 2 11.3 2 6.4 6.9 2.5 13 2.5z"/><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 8.8v4.8h2.6"/><path d="M11 8.8v4.8"/><path d="M13.3 13.6V8.8l3.2 4.8V8.8"/><path d="M21 8.8h-2.6v4.8H21M18.4 11.2H21"/></g></svg>
      LINE</a></li>
    <li data-c="wechat"><a href="#">
      <svg viewBox="0 0 26 26" aria-hidden="true"><path fill="currentColor" d="M10 3.2c-4.7 0-8.5 3.1-8.5 6.9 0 2.2 1.2 4.1 3.1 5.4l-.8 2.4 2.9-1.5c1 .3 2.1.5 3.3.5h.6a6.3 6.3 0 0 1-.3-1.9c0-3.9 3.7-6.9 8.2-6.9h.6C18.4 5.4 14.6 3.2 10 3.2z"/><path fill="none" stroke="currentColor" stroke-width="1.7" d="M17.6 10.4c-3.9 0-7 2.6-7 5.8s3.1 5.8 7 5.8c.9 0 1.8-.1 2.6-.4l2.3 1.2-.6-2c1.6-1.1 2.6-2.7 2.6-4.6 0-3.2-3.1-5.8-6.9-5.8z"/><g fill="#fff"><circle cx="7" cy="8.6" r="1.1"/><circle cx="12.6" cy="8.6" r="1.1"/></g><g fill="currentColor"><circle cx="15.3" cy="15.2" r=".95"/><circle cx="19.9" cy="15.2" r=".95"/></g></svg>
      WeChat</a></li>
  </ul>
  <div class="sp"></div>

  <button class="save" type="button" id="save">
    <svg viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="18" height="14" rx="1.5"/><circle cx="8" cy="10" r="2.3"/><path d="M4.6 15.4c.6-1.6 1.9-2.4 3.4-2.4s2.8.8 3.4 2.4M13.5 9h4M13.5 12.5h3"/></svg>
    <span id="saveLabel">Save contact</span>
  </button>

</main>
</div>

<script>
const L = {
  en:{name:"English", g:"Hi, I'm Neil.", l:"Great to meet you. Here's where to find me.", s:"Save contact", o:["linkedin","whatsapp","line","wechat"], city:"London"},
  th:{name:"ไทย", g:"สวัสดีครับ ผม Neil", l:"ยินดีที่ได้รู้จักครับ ติดต่อผมได้ทางนี้", s:"บันทึกรายชื่อ", o:["line","whatsapp","linkedin","wechat"], city:"Bangkok"},
  zh:{name:"中文", g:"你好，我是 Neil", l:"很高兴认识你，可以在这里找到我。", s:"保存联系人", o:["wechat","linkedin","whatsapp","line"], city:"Shanghai"},
  he:{name:"עברית", g:"היי, אני ניל", l:"נעים להכיר! כאן אפשר למצוא אותי.", s:"שמירת איש קשר", o:["whatsapp","linkedin","line","wechat"], city:"Tel Aviv"},
  es:{name:"Español", g:"¡Hola! Soy Neil.", l:"Encantado de conocerte. Aquí me encuentras.", s:"Guardar contacto", o:["whatsapp","linkedin","line","wechat"], city:"Madrid"}
};
const $ = id => document.getElementById(id);
const picker = $("picker"), btn = $("pickBtn"), sheet = $("sheet"), to = $("to");
const tick = '<svg viewBox="0 0 20 16" aria-hidden="true"><path d="M2 8.5 7.5 14 18 2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

sheet.innerHTML = Object.keys(L).map(k =>
  `<li><button type="button" role="option" data-l="${k}" lang="${k}"><span dir="${k==="he"?"rtl":"ltr"}">${L[k].name}</span>${tick}</button></li>`).join("");

function setLang(k){
  const t = L[k] || L.en;
  const root = document.documentElement;
  root.lang = k; root.dir = k === "he" ? "rtl" : "ltr";
  $("greet").textContent = t.g;
  $("line").textContent = t.l;
  $("saveLabel").textContent = t.s;
  $("pickLabel").textContent = t.name;
  // city placeholder: the live page fills this from Cloudflare's request.cf.city
  $("city").textContent = t.city.toUpperCase();
  t.o.forEach(c => to.appendChild(to.querySelector(`[data-c="${c}"]`)));
  sheet.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", b.dataset.l === k));
}
function openPicker(on){
  picker.classList.toggle("open", on);
  btn.setAttribute("aria-expanded", on);
}
btn.addEventListener("click", e => { e.stopPropagation(); openPicker(!picker.classList.contains("open")); });
sheet.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  setLang(b.dataset.l); openPicker(false); btn.focus();
});
document.addEventListener("click", e => { if(!picker.contains(e.target)) openPicker(false); });
document.addEventListener("keydown", e => { if(e.key === "Escape") openPicker(false); });

const q = new URLSearchParams(location.search);
setLang(L[q.get("lang")] ? q.get("lang") : "en");
if(q.get("picker") === "open") openPicker(true);
</script>
</body>
</html>
