<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..500&family=Noto+Sans+Thai:wght@400;500&family=Noto+Sans+Hebrew:wght@400;500&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&display=block&text=%%SCTEXT%%">
<style>
  :root {
    /* njct.io's wall: the desktop grey and its soft radial light (index.html --ground), darker on a phone (crate groundGain) */
    --ground: radial-gradient(120% 60% at 50% 80%, rgb(211 211 211), rgb(216 216 216) 45%, rgb(220 220 220) 100%) rgb(220 220 220);
    /* the café's sun (scene/sun.js njSunColour): amber at the patch's edges, a warm near-white in its full light */
    --sun-edge: #FFC48C;
    --sun-core: #FFEBD6;
    --ink: #000;
    --ink-soft: rgba(0, 0, 0, 0.6);
    --pill-light: rgba(255, 255, 255, 0.7);
    --rule: rgba(0, 0, 0, 0.1);
    --gutter: 16px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --face: 'Inter', 'Noto Sans Thai', 'Noto Sans Hebrew', 'Noto Sans SC', sans-serif;
  }
  @media (max-width: 599px) {
    :root { --ground: radial-gradient(130% 55% at 50% 85%, rgb(195.5 195.5 195.5), rgb(200.5 200.5 200.5) 45%, rgb(204.8 204.8 204.8) 100%) rgb(204.8 204.8 204.8); }
  }
  html { background: var(--ground); overflow-x: clip; }
  body {
    margin: 0; min-height: 100dvh; overflow-x: clip; background: transparent;
    font: 400 16px/22px var(--face); color: var(--ink);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; margin: 0; }
  :focus-visible { outline: 2px solid #000; outline-offset: 2px; }

  /* The room: one column on the wall, and the late sun through the street window falling across it. */
  .page {
    position: relative; box-sizing: border-box; max-width: 430px; min-height: 100dvh; margin: 0 auto;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; container-type: inline-size;
  }
  .page > :not(.light) { position: relative; z-index: 1; }

  /* The light is drawn in a 390-wide frame that scales with the column, so the greeting always lands
     in the lower lights, under the transom. */
  .light { position: absolute; inset: 0 0 auto 0; aspect-ratio: 390 / 844; pointer-events: none; z-index: 0; }
  .light svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
  [dir="rtl"] .light svg { transform: scaleX(-1); }
  .sun-edge { fill: var(--sun-edge); }
  .sun-core { fill: var(--sun-core); }
  /* Where the stranger's head falls in the light: stage 2's avatar steps into this spot. */
  .seat {
    position: absolute; inset-inline-start: calc(195 / 390 * 100%); top: calc(143 / 844 * 100%);
    width: calc(98 / 390 * 100%); aspect-ratio: 98 / 110;
  }

  /* The header, as njct.io's: the wordmark, and the language picker built as the Projects menu. */
  .mast { position: relative; height: 54px; z-index: 3 !important; }
  .wordmark {
    position: absolute; inset-inline-start: var(--gutter); top: 5px; padding: 12px 0; min-width: 44px;
    font-weight: 500; line-height: 20px; color: var(--ink); text-decoration: none; font-family: 'Inter', sans-serif;
  }
  .pm { position: absolute; top: 5px; inset-inline-start: calc(var(--gutter) + 82px); }
  .pm-btn {
    display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; border: 0; border-radius: 4px;
    background: transparent; color: var(--ink); font-weight: 500; line-height: 16px; letter-spacing: -0.01em; cursor: pointer;
    transition: color 0.3s var(--ease), background-color 0.3s var(--ease);
  }
  @media (hover: hover) { .pm-btn:hover { background: #000; color: #fff; } .pm-list a:hover { background: rgb(244 244 244); } }
  .pm-btn svg { width: 16px; height: 16px; display: block; transition: transform 0.3s var(--ease); }
  .pm.open .pm-btn svg { transform: rotate(180deg); }
  .pm-list {
    position: absolute; inset-inline-start: 0; top: calc(100% + 8px); margin: 0; padding: 0; list-style: none; box-sizing: border-box;
    min-width: 220px; background: #fff; border-radius: 4px;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
    opacity: 0; visibility: hidden; translate: 0 -10px;
    transition: opacity 0.3s var(--ease), visibility 0.3s var(--ease), translate 0.3s var(--ease);
  }
  .pm.open .pm-list { opacity: 1; visibility: visible; translate: none; transition: opacity 0.3s var(--ease) 0.1s, visibility 0s, translate 0.3s var(--ease) 0.1s; }
  .pm.instant .pm-list { transition: none; }
  .pm-list li { border-bottom: 1px solid rgb(236 236 236); }
  .pm-list li:last-child { border-bottom: 0; }
  .pm-list a {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 0 12px;
    box-sizing: border-box; color: #000; text-decoration: none; font-size: 16px; line-height: 20px;
  }
  .pm-list a:focus-visible { outline-offset: -2px; }
  .pm-list svg { width: 16px; height: 16px; flex: none; visibility: hidden; }
  .pm-list a[aria-current="true"] svg { visibility: visible; }
  /* A phone: the list is a sheet from the bottom of the screen, as the Projects menu is. */
  @media (max-width: 599px) {
    .pm-list {
      position: fixed; left: 0; right: 0; top: auto; bottom: 0; min-width: 0; border-radius: 4px 4px 0 0;
      padding-bottom: env(safe-area-inset-bottom); translate: 0 50px;
    }
    .pm-list a { min-height: 52px; padding: 0 var(--gutter); font-size: 17px; }
  }

  /* The upper lights hold the leaves and the figure; the copy starts below the transom's shadow. */
  .stage { flex: none; height: calc(434 / 390 * 100cqw - 54px); }

  .hello { padding-inline: var(--gutter); }
  h1 {
    margin: 0; font-size: 60px; line-height: 62px; font-weight: 500; letter-spacing: -0.035em; text-wrap: balance;
  }
  :lang(th) h1 { font-size: 44px; line-height: 60px; letter-spacing: -0.01em; }
  :lang(zh) h1 { font-size: 50px; line-height: 62px; letter-spacing: 0; }
  :lang(he) h1 { letter-spacing: -0.015em; }
  :lang(es) h1 { font-size: 54px; line-height: 58px; }
  .line { margin: 12px 0 0; max-width: 30ch; font-size: 17px; line-height: 25px; color: var(--ink-soft); text-wrap: pretty; }
  :lang(th) .line { line-height: 28px; }

  /* The channels, as the site's pills: black first (Open), light after (Details). */
  .channels { display: flex; flex-wrap: wrap; gap: 10px 8px; margin-top: 28px; padding-inline: var(--gutter); }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; box-sizing: border-box; height: 44px; padding-inline: 15px 18px;
    border-radius: 22px; background: var(--pill-light); color: var(--ink); text-decoration: none; white-space: nowrap;
    font-family: 'Inter', sans-serif; font-size: 16px; line-height: 44px;
    transition: background-color 0.2s var(--ease), color 0.2s var(--ease);
  }
  .pill svg { width: 18px; height: 18px; flex: none; display: block; }
  .pill.lead { background: #000; color: #fff; }
  @media (hover: hover) { .pill:not(.lead):hover { background: #fff; } .pill.lead:hover { background: #222; } }
  .pill:active { scale: 0.98; }

  .foot { margin-top: auto; padding: 28px var(--gutter) 0; }
  .foot-in { display: flex; justify-content: flex-end; padding-top: 14px; border-top: 1px solid var(--rule); }
  .foot .pill { font-family: var(--face); }

  @media (max-height: 700px) { .channels { margin-top: 22px; } }
  @media (min-width: 600px) { .mast { margin-top: 8px; } .foot { padding-bottom: 24px; } }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="light" aria-hidden="true">
    <svg viewBox="0 0 390 844">
      <defs>
        <filter id="pen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.3"/></filter>
        <filter id="far" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
        <filter id="near" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
        <filter id="fig" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
        <!-- the full light: the same shapes, pulled in from their edges, so every edge keeps an amber rim -->
        <filter id="core" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="2.6"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.6" intercept="-0.6"/><feFuncG type="linear" slope="1.6" intercept="-0.6"/><feFuncB type="linear" slope="1.6" intercept="-0.6"/></feComponentTransfer>
        </filter>
        <!-- What the window lets through: the opening, its head and sill falling to the left with the low sun;
             the glazing bars and the transom; the foliage outside (sun.js LEAF_FRAG); someone standing at the glass, cut off at the shoulders by the transom. -->
        <g id="lit">
          <g id="g-win" filter="url(#pen)">
            <polygon points="6,128 900,-105 900,511 6,744" fill="#fff"/>
            <polygon points="352,-300 360,-300 360,1100 352,1100" fill="#000"/>
            <polygon points="652,-300 660,-300 660,1100 652,1100" fill="#000"/>
            <polygon points="-300,494 900,181 900,190 -300,503" fill="#000"/>
          </g>
          <g id="g-leaves" fill="#000">
            <path filter="url(#far)" d="%%CROWN%%"/>
            <path filter="url(#near)" d="%%BRANCH%% %%ROSETTES%%"/>
            <path filter="url(#near)" fill-rule="evenodd" d="%%MONSTERA%%"/>
            <!-- beyond the phone's frame, seen only on a wider screen: more of the street's foliage -->
            <path filter="url(#far)" d="%%CROWN2%%"/>
            <path filter="url(#near)" fill-rule="evenodd" d="%%MONSTERA2%%"/>
          </g>
          <g id="g-fig">
            <g filter="url(#fig)" transform="translate(244 198) skewY(-14.6) scale(1.1)">
              <ellipse cx="0" cy="0" rx="40" ry="47" fill="#000"/>
              <ellipse cx="-39" cy="7" rx="7" ry="11" fill="#000"/>
              <ellipse cx="39" cy="7" rx="7" ry="11" fill="#000"/>
              <path d="M-17 30 L17 30 L19 62 C34 74 72 76 92 92 C106 104 112 126 114 146 L-114 146 C-112 126 -106 104 -92 92 C-72 76 -34 74 -19 62 Z" fill="#000"/>
            </g>
          </g>
        </g>
        <mask id="m-edge" maskUnits="userSpaceOnUse" x="-400" y="-400" width="1600" height="1700"><use href="#lit"/></mask>
        <mask id="m-core" maskUnits="userSpaceOnUse" x="-400" y="-400" width="1600" height="1700"><use href="#lit" filter="url(#core)"/></mask>
      </defs>
      <g id="sun">
        <rect id="sun-edge" class="sun-edge" x="-400" y="-400" width="1600" height="1700" mask="url(#m-edge)" opacity="0.72"/>
        <rect id="sun-core" class="sun-core" x="-400" y="-400" width="1600" height="1700" mask="url(#m-core)" opacity="0.86"/>
      </g>
    </svg>
    <div class="seat" id="seat"></div>
  </div>

  <header class="mast">
    <a class="wordmark" href="#"><span dir="ltr">njct.io</span></a>
    <div class="pm" id="pm">
      <button class="pm-btn" id="pm-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="pm-list"><span id="pm-label">English</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
      <ul class="pm-list" id="pm-list" aria-labelledby="pm-btn"></ul>
    </div>
  </header>

  <div class="stage"></div>

  <section class="hello">
    <h1 id="greet">Hi, I’m Neil.</h1>
    <p class="line" id="line">Great to meet you. Here's where to find me.</p>
  </section>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <mask id="m-li" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18"><rect width="18" height="18" fill="#fff"/><g fill="#000"><rect x="4.6" y="7.4" width="2.2" height="6.2"/><circle cx="5.7" cy="5.2" r="1.3"/><path d="M8.6 7.4h2.1v.9c.4-.7 1.2-1.1 2.1-1.1 1.6 0 2.4 1 2.4 2.8v3.6H13v-3.3c0-.9-.3-1.4-1.1-1.4-.8 0-1.2.6-1.2 1.4v3.3H8.6z"/></g></mask>
    <mask id="m-line" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18"><rect width="18" height="18" fill="#fff"/><g fill="#000"><path d="M3.3 6h1v3.1h1.9V10H3.3z"/><rect x="6.7" y="6" width="1" height="4"/><path d="M8.4 6h.95l1.65 2.4V6h.95v4h-.95L9.35 7.6V10H8.4z"/><path d="M12.3 6h2.4v.85h-1.45v.7h1.35v.85h-1.35v.75h1.45V10h-2.4z"/></g></mask>
    <mask id="m-wc" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18"><rect width="18" height="18" fill="#fff"/><g fill="#000"><circle cx="5.1" cy="6" r=".85"/><circle cx="8.9" cy="6" r=".85"/></g></mask>
  </defs></svg>
  <nav class="channels" id="channels" aria-label="LinkedIn, WhatsApp, LINE, WeChat">
    <a class="pill" href="#" data-ch="linkedin"><svg viewBox="0 0 18 18" aria-hidden="true"><rect x="1.5" y="1.5" width="15" height="15" rx="3" fill="currentColor" mask="url(#m-li)"/></svg>LinkedIn</a>
    <a class="pill" href="#" data-ch="whatsapp"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1.9a7 7 0 0 0-6 10.6L2 16.1l3.7-1A7 7 0 1 0 9 1.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.6 5.6c.2-.2.5-.2.7 0l.8 1.3c.1.2.1.5-.1.7l-.5.5c.4.9 1.2 1.7 2.1 2.1l.5-.5c.2-.2.5-.2.7-.1l1.3.8c.2.1.3.5.1.7l-.5.7c-.3.4-.9.5-1.4.3-2-.8-3.6-2.4-4.4-4.4-.2-.5-.1-1.1.3-1.4z" fill="currentColor"/></svg>WhatsApp</a>
    <a class="pill" href="#" data-ch="line"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1.8C4.7 1.8 1.2 4.5 1.2 7.9c0 3 2.7 5.5 6.4 5.9.3.1.5.4.4.7l-.2 1.3c-.1.4.3.7.7.5 2.8-1.4 8.3-4.5 8.3-8.4 0-3.4-3.5-6.1-7.8-6.1z" fill="currentColor" mask="url(#m-line)"/></svg>LINE</a>
    <a class="pill" href="#" data-ch="wechat"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M7 2.4C3.9 2.4 1.4 4.5 1.4 7.1c0 1.5.8 2.8 2.1 3.7l-.5 1.7 2-1.1c.6.2 1.3.3 2 .3h.4a4.6 4.6 0 0 1-.2-1.3c0-2.6 2.5-4.7 5.6-4.7h.3C12.5 3.8 10 2.4 7 2.4z" fill="currentColor" mask="url(#m-wc)"/><path d="M12.4 7.6c-2.6 0-4.6 1.7-4.6 3.8s2 3.8 4.6 3.8c.5 0 1-.1 1.5-.2l1.6.9-.4-1.4c1.1-.7 1.8-1.8 1.8-3.1 0-2.1-2-3.8-4.5-3.8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10.9" cy="10.6" r=".7" fill="currentColor"/><circle cx="13.9" cy="10.6" r=".7" fill="currentColor"/></svg>WeChat</a>
  </nav>

  <footer class="foot">
    <div class="foot-in">
      <a class="pill" href="#" id="save"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="6.2" r="3"/><path d="M2.2 15.5c.6-2.7 2.7-4.4 5.3-4.4 1.1 0 2.1.3 2.9.8M13.5 10.5v5M11 13h5"/></svg><span id="save-t">Save contact</span></a>
    </div>
  </footer>
</div>

<script>
(() => {
  const L = {
    en: { name: 'English', greet: 'Hi, I’m Neil.', line: "Great to meet you. Here's where to find me.", save: 'Save contact', order: ['linkedin', 'whatsapp', 'line', 'wechat'] },
    th: { name: 'ไทย', greet: 'สวัสดีครับ ผม Neil', line: 'ยินดีที่ได้รู้จักครับ ติดต่อผมได้ทางนี้', save: 'บันทึกรายชื่อ', order: ['line', 'whatsapp', 'linkedin', 'wechat'] },
    zh: { name: '中文', greet: '你好，我是 Neil', line: '很高兴认识你，可以在这里找到我。', save: '保存联系人', order: ['wechat', 'linkedin', 'whatsapp', 'line'] },
    he: { name: 'עברית', greet: 'היי, אני ניל', line: 'נעים להכיר! כאן אפשר למצוא אותי.', save: 'שמירת איש קשר', order: ['whatsapp', 'linkedin', 'line', 'wechat'] },
    es: { name: 'Español', greet: '¡Hola! Soy Neil.', line: 'Encantado de conocerte. Aquí me encuentras.', save: 'Guardar contacto', order: ['whatsapp', 'linkedin', 'line', 'wechat'] },
  };
  const NAMES = { linkedin: 'LinkedIn', whatsapp: 'WhatsApp', line: 'LINE', wechat: 'WeChat' };
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement, pm = $('pm'), btn = $('pm-btn'), list = $('pm-list'), chans = $('channels');
  const check = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  list.innerHTML = Object.entries(L).map(([k, v]) => `<li><a href="?lang=${k}" data-lang="${k}"><span lang="${k === 'zh' ? 'zh-Hans' : k}" dir="auto">${v.name}</span>${check}</a></li>`).join('');

  function setLang(k) {
    if (!L[k]) k = 'en';
    const v = L[k];
    root.lang = k === 'zh' ? 'zh-Hans' : k;
    root.dir = k === 'he' ? 'rtl' : 'ltr';
    $('pm-label').textContent = v.name;
    $('greet').textContent = v.greet; $('line').textContent = v.line; $('save-t').textContent = v.save;
    v.order.forEach((c, i) => { const a = chans.querySelector(`[data-ch="${c}"]`); a.classList.toggle('lead', i === 0); chans.append(a); });
    chans.setAttribute('aria-label', v.order.map((c) => NAMES[c]).join(', '));
    list.querySelectorAll('a').forEach((a) => a.setAttribute('aria-current', a.dataset.lang === k ? 'true' : 'false'));
    const u = new URL(location.href); u.searchParams.set('lang', k); u.searchParams.delete('picker');
    try { history.replaceState(null, '', u); } catch {}
  }
  function open(on) { pm.classList.toggle('open', on); btn.setAttribute('aria-expanded', on); }
  btn.addEventListener('click', () => open(!pm.classList.contains('open')));
  list.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-lang]'); if (!a) return;
    e.preventDefault(); setLang(a.dataset.lang); open(false); btn.focus();
  });
  document.addEventListener('click', (e) => { if (!pm.contains(e.target)) open(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && pm.classList.contains('open')) { open(false); btn.focus(); } });

  // The one motion: the sun arriving. The light slides in along its own slope and comes up, amber first and
  // the full light after; the leaves, farther out than the glass, travel further (parallax), the figure
  // between them. Driven from JS so it always ends at rest (a timeout snaps it there).
  const DUR = 2400, win = $('g-win'), leaves = $('g-leaves'), fig = $('g-fig'), edge = $('sun-edge'), core = $('sun-core');
  const out = (p) => 1 - Math.pow(1 - p, 3);
  function frame(p) {
    const m = 1 - out(p);
    win.setAttribute('transform', `translate(${52 * m} ${-14 * m})`);
    fig.setAttribute('transform', `translate(${70 * m} ${-18 * m})`);
    leaves.setAttribute('transform', `translate(${92 * m} ${-24 * m})`);
    edge.setAttribute('opacity', (0.72 * out(Math.min(1, p / 0.5))).toFixed(3));
    core.setAttribute('opacity', (0.86 * out(Math.max(0, (p - 0.15) / 0.85))).toFixed(3));
  }
  const q = new URLSearchParams(location.search);
  const still = q.has('still') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (q.has('t')) frame(Math.min(1, +q.get('t') / DUR));
  else if (!still) {
    let t0 = 0, done = false;
    const rest = () => { if (!done) { done = true; frame(1); } };
    frame(0);
    const tick = (now) => { if (done) return; t0 ||= now; const p = (now - t0) / DUR; if (p >= 1) rest(); else { frame(p); requestAnimationFrame(tick); } };
    requestAnimationFrame(tick);
    setTimeout(rest, DUR + 400);
  }

  setLang(q.get('lang') || 'en');
  if (q.get('picker') === 'open') { pm.classList.add('instant'); open(true); requestAnimationFrame(() => requestAnimationFrame(() => pm.classList.remove('instant'))); }
})();
</script>
</body>
</html>
