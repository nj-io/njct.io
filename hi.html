// Fills the page in one language: every [data-stet] element's text (the English string where the language has
// none), the pill order (D2: by language, and by country for an English page) with the first pill black, the
// WhatsApp message, and the picker's list with the language checked. The page's own markup is the English page.
function hiApply(lang) {
  const html = document.documentElement, en = COPY.en, own = COPY[lang] || en;
  const text = (k) => (own[k] !== undefined ? own[k] : en[k]);
  html.lang = lang;
  html.dir = lang === 'he' ? 'rtl' : 'ltr';
  for (const el of document.querySelectorAll('[data-stet]')) {
    const t = text(el.dataset.stet);
    if (t !== undefined && el.textContent !== t) el.textContent = t;

  // ?cc= stands in for the country Function in tests and on previews

  pills.querySelector('[data-href="whatsapp"]').href = CONTACT.whatsapp + (wa ? `?text=${encodeURIComponent(wa)}` : '');
