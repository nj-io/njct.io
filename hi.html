<script>
// The leaf shadows (§ 1, § 7): v6's leaf renderer (I v3), redrawn in plate coordinates over the photograph.
// A leaf's shadow on a sunlit wall is that wall without the sun's share of its light, and the plate holds both
// states. Each leaf is a pre-blurred bitmap in the plate's measured shade colour (PLATES.<p>.shade) that only
// moves by transform; overlaps accumulate alpha (the sun's visibility through each, multiplied), the sun mask
// then keeps them only where the plate's wall is in sunlight (destination-in), and the canvas multiplies over
// the plate: full alpha gives exactly the plate's own shade, a blurred edge the partial light of a penumbra.
// Shapes and wind are scene/sun.js's (crown, monstera, frangipani), sized in v6's frame units (CSS px on a

  // wall in the café's units: the glass 1367, the frangipani and monstera 1867, the street tree's crown 2300.
  // Gaussian sigma and the tilt's shift, in frame units: leaves 1.78 and 15.2, the crown 2.19 and 18.
  const DIST = { glass: 1367, leaf: 1867, crown: 2300 };

  for (const d of ['leaf', 'crown']) {
    SIG[d] = 1.3 * DIST[d] / DIST.glass;
    AMP[d] = 12 + 6 * (DIST[d] - DIST.glass) / (DIST.crown - DIST.glass);
  }
  // v6's foliage, in frame units, in the order PLATES.<p>.leaves places them: two crowns (radii, seed), two
  // monsteras (length, seed), and the frangipani branch (its base b0, out to the first rosette c1, a twig on to
  // the second c2; twig widths, then each rosette's leaf length and width).
  const CROWNS = [[112, 90, 7], [150, 110, 11]];
  const MONSTERAS = [[178, 3], [230, 5]];
  const q = new URLSearchParams(location.search);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const rng = (a) => () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

    b.shadowColor = shade; b.shadowBlur = 2 * sig; b.shadowOffsetX = src.width;   // shadowBlur = 2 sigma, in pixels

  }

    const pad = 3 * sig + 2, X = x0 - pad, Y = y0 - pad;

    s.setTransform(k, 0, 0, k, -X * k, -Y * k); s.fillStyle = s.strokeStyle = '#000'; s.beginPath(); draw(s);

  const boxless = !(window.CSS && CSS.supports && CSS.supports('width: 100cqw') && CSS.supports('aspect-ratio: 1'));

      crowns: (L.crowns || []).slice(0, CROWNS.length).map((pt, i) => {

      monsteras: (L.monsteras || []).slice(0, MONSTERAS.length).map(([x, y, a], i) => {

  function sun() {

    g.drawImage(mask, 0, 0, W, H);

    const gust = Math.max(0, Math.min(1, (0.5 + 0.5 * Math.sin(t * 0.23 + 1.1) * Math.sin(t * 0.071 + 0.4) - 0.62) / 0.33));

    const U = 0.5;                                 // these leaves are drawn at half the site's size (a 64-unit
                                                   // frangipani leaf for its 135), so its drifts halve too
    const put = (spr, fn) => { g.setTransform(k, 0, 0, k, 0, 0); fn(); g.drawImage(spr.c, spr.X, spr.Y, spr.w, spr.h); };
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W, H);
    // the crown drifts as sun.js moves it, (sin 0.61t, cos 0.47t) x 2.5
    for (const c of S.crowns) put(c.spr, () => g.translate(c.at[0] + oCrown[0] + Math.sin(t * 0.61) * 2.5 * U, c.at[1] + oCrown[1] - Math.cos(t * 0.47) * 2.5 * U));
    // the monstera turns 1 deg with the sway, about its stem

    const B = S.branch;

      });
      tip(B.limb1, B.b0, B.c1, c1); tip(B.limb2, B.m, B.c2, c2);
      for (const [rs, c, sw] of [[B.rose1, c1, 0.05 * sway + 0.08 * gs * Math.sin(t * 6.0)], [B.rose2, c2, 0.06 * sway + 0.08 * gs * Math.sin(t * 6.4)]])
        for (const l of rs) put(l.spr, () => { g.translate(oLeaf[0] + c[0], oLeaf[1] + c[1]); g.rotate(l.a + sw * (0.6 + 0.4 * Math.sin(l.i))); });
    }
    sun();
    if (!shown) { shown = performance.now(); cv.style.opacity = '1'; }   // fades in over 1.2 s (the CSS transition)
  }

  // ---- Motion (§ 7) ---------------------------------------------------------------------------------
  // The leaves move all the time in the café's wind at 30 Hz, drawn at the display's rate only while the canvas
  // fades in; tilting an Android phone shifts them, the crown most. A hidden tab, or the scene out of view,
  // stops the loop; reduced motion, ?still and ?t= draw one still frame.
  const FADE = 1200;
  let T0 = 0, raf = 0, lastDraw = -1e9, lastNow = 0, tiltRaw = null;
  let tilt = (q.get('tilt') || '0,0').split(',').map(Number);
  function tick(now) {
    raf = requestAnimationFrame(tick);
    const dt = Math.min(100, now - (lastNow || now)); lastNow = now;
    if (tiltRaw) {                                 // a low-pass of about 150 ms on the phone's tilt
      const a = 1 - Math.exp(-dt / 150);
      tilt = [tilt[0] + (tiltRaw[0] - tilt[0]) * a, tilt[1] + (tiltRaw[1] - tilt[1]) * a];
    }
    if (shown && now - shown > FADE && now - lastDraw < 29) return;
    lastDraw = now;
    paint((now - T0) / 1000, tilt);
  }
  function start() { if (!raf) { lastNow = 0; raf = requestAnimationFrame(tick); } }
  function stop() { cancelAnimationFrame(raf); raf = 0; }
  const rest = () => paint(q.has('t') ? +q.get('t') || 0 : REST_T, tilt);
  function redraw() { if (still) rest(); else lastDraw = -1e9; }

  // Tilt: gamma and beta against a phone held upright at 45 deg, 30 deg either way to the full shift.
  function onTilt(e) {
    if (e.gamma == null || e.beta == null) return;
    const c = (v) => Math.max(-1, Math.min(1, v / 30));
    tiltRaw = [c(e.gamma), c(e.beta - 45)];
  }

  build();
  if (still) { cv.style.transition = 'none'; rest(); }
  else {
    T0 = performance.now();
    let visible = !document.hidden, inView = true;
    const run = () => (visible && inView ? start() : stop());
    document.addEventListener('visibilitychange', () => { visible = !document.hidden; run(); });
    if (window.IntersectionObserver) new IntersectionObserver((es) => { inView = es[es.length - 1].isIntersecting; run(); }).observe(scene);
    run();
    // iOS asks permission for motion through a system dialog, and the page never asks (§ 9, question 8).
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission !== 'function') addEventListener('deviceorientation', onTilt);
  }
  // A new plate with the orientation, and a new box on a resize; the sprites are rebuilt only when the
  // canvas's size or plate changes.
  const rebuild = () => { if (build()) redraw(); };
  const mq = matchMedia(WIDE);
  if (mq.addEventListener) mq.addEventListener('change', rebuild); else if (mq.addListener) mq.addListener(rebuild);
  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(rebuild, 120); });
})();
</script>
</body>
</html>
