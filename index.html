<style>
  @font-face {
    font-family: 'NJ Text';

  }

       as one radial gradient on the same ellipse, scaled with the view (config.js viewScale), so the canvas

  }
  body {
    font: 400 14px/20px 'NJ Text', system-ui, sans-serif; color: var(--ink);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; }

  .tagline { position: absolute; left: var(--gutter); top: 60px; margin: 0; font-size: 14px; font-weight: 400; line-height: 18px; color: var(--ink-soft); }

  .cta {
    position: absolute; right: var(--gutter); top: 8px; height: 34px; padding: 0 14px; border: 0; border-radius: 17px;
    background: #000; color: #fff; line-height: 34px; text-decoration: none;
  }
  /* The Projects menu (editions/menu.js), as the reference's Editions menu: measured at 1440x900 and

  .pm { position: absolute; top: 8px; left: calc(var(--gutter) + 86px); --pm-ease: cubic-bezier(0.4, 0, 0.2, 1); }
  .pm-btn {
    display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 8px; border: 0; border-radius: 4px;
    background: transparent; color: var(--ink); font-weight: 500; line-height: 14px; letter-spacing: -0.01em; cursor: pointer;

  }
  @media (hover: hover) { .pm-btn:hover { background: #000; color: #fff; } .pm-list li:hover { background: rgb(244 244 244); } }
  .pm-btn svg { width: 16px; height: 16px; display: block; }
  .pm.open .pm-btn svg { transform: rotate(180deg); }
  .pm-list {
    position: absolute; left: 0; top: calc(100% + 8px); margin: 0; padding: 0; list-style: none; box-sizing: border-box;

  /* Opening waits 0.1 s, as on the reference; the list is visible (still transparent) at once, so the

  .pm.open .pm-list {

    transition: opacity 0.3s var(--pm-ease) 0.1s, visibility 0s, translate 0.3s var(--pm-ease) 0.1s;
  }
  .pm-list li { border-bottom: 1px solid rgb(236 236 236); }
  .pm-list li:last-child { border-bottom: 0; }
  .pm-item { display: flex; align-items: center; gap: 10px; padding: 10px 10px 7px; color: #000; text-decoration: none; }
  .pm-item:focus-visible { outline-offset: -2px; }

  @media (max-width: 599px) {
    .pm-list {

  .sound {

  .ct-body { position: relative; padding: 28px 28px 24px; overflow-y: auto; max-height: calc(100vh - 32px); box-sizing: border-box; }
  .ct-title { margin: 0 0 20px; font-size: 24px; line-height: 28px; font-weight: 400; }
  .ct-form { display: grid; gap: 14px; }

  .ct-form input, .ct-form textarea {

    position: fixed; width: 56px; height: 56px; margin: -28px 0 0 -28px; padding: 0; border: 0; border-radius: 50%;

  .d-play[hidden], .d-close[hidden] { display: none; }
  .d-play svg { width: 20px; height: 20px; margin-left: 3px; }
  .d-play:focus-visible, .d-close:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .film-shade { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 20; }
  .film-shade.on { opacity: 1; pointer-events: auto; }
  .film-frame { position: fixed; z-index: 21; overflow: hidden; border-radius: 4px; background: #000; opacity: 0; pointer-events: none; }
  .film-frame.on { opacity: 1; pointer-events: auto; }
  .film-frame video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .d-close {
    position: fixed; z-index: 22; top: 16px; right: 16px; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, 0.9); color: #000; font-size: 22px; line-height: 44px; cursor: pointer;

  /* The phone crate: the list stays for screen readers and the keyboard; the bar and rail are its controls. */
  .crate-bar, .crate-rail { display: none; }

  .crate.in-details .cb-label, .crate.in-details .cb-details { display: none; }
  .crate .crate-rail { display: block; position: fixed; right: 20px; top: 41.5%; width: 3px; height: 17%; border-radius: 2px; background: rgba(0, 0, 0, 0.12); }
  .crate-rail span { position: absolute; left: 0; top: 0; width: 3px; height: 24px; border-radius: 2px; background: #000; }
  .crate.in-details .crate-rail { opacity: 0 !important; transition: opacity 0.2s; }
  .crate canvas { touch-action: none; }

  /* Touch: every control is at least 44 px each way. */
  @media (pointer: coarse) {
    .wordmark { top: 3px; padding: 12px 0; min-width: 44px; }
    .cta { top: 5px; height: 44px; line-height: 44px; border-radius: 22px; padding: 0 18px; }

  .no-gl canvas, .no-gl #slots, .no-gl .index, .no-gl .crate-bar, .no-gl .crate-rail, .no-gl .details, .no-gl .d-open, .no-gl .d-play, .no-gl .film-frame, .no-gl .sound { display: none !important; }

  .fb-item, .fb-item article { height: 100%; }
  .fb-item article { display: flex; flex-direction: column; gap: 6px; }
  .fb-cover { aspect-ratio: 1; display: flex; align-items: flex-start; padding: 14px; box-sizing: border-box; background: var(--c); color: var(--f); text-decoration: none;

  .fb-item h2 { margin: 0; font-size: 16px; line-height: 20px; font-weight: 500; }
  .fb-tag { margin: 0; color: var(--ink-soft); }
  .fb-figs { margin: 4px 0 8px; padding: 0; list-style: none; font-size: 12px; line-height: 17px; color: var(--ink-soft); }
  .fb-figs b { color: var(--ink); font-weight: 500; }
  .fb-open { align-self: flex-start; margin-top: auto; height: 44px; padding: 0 18px; border-radius: 22px; background: #000; color: #fff; line-height: 44px; text-decoration: none; }

<canvas id="c" aria-hidden="true"></canvas>
<header class="masthead">
  <a class="wordmark rise" href="/">njct.io</a>
  <h1 class="tagline late">Systems I've designed and built.</h1>
  <nav class="pm">
    <button class="pm-btn rise" id="pm-btn" type="button" aria-expanded="false" aria-controls="pm-list">Projects<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
    <ul class="pm-list" id="pm-list" aria-labelledby="pm-btn"></ul>
  </nav>
  <a class="cta rise" href="mailto:neil@njct.io">Get in touch</a>
  <button class="sound late" type="button" aria-pressed="false" aria-label="Sound">
    <svg class="off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"/><path d="M10.6 6.2l3.4 3.6M14 6.2l-3.4 3.6"/>
    </svg>
    <svg class="on" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"/><path d="M10.4 5.6a3.3 3.3 0 0 1 0 4.8M12.3 3.9a5.8 5.8 0 0 1 0 8.2"/>
    </svg>
  </button>
</header>
<ul id="slots" aria-label="Projects"></ul>
<div class="index late" aria-hidden="true"><ol id="index"></ol></div>
<div class="crate-bar late" id="crate-bar">
  <p class="cb-label" aria-hidden="true"><span class="cb-year"></span><span class="cb-name"></span></p>
  <button class="cb-back" type="button">Back</button>
  <button class="cb-details" type="button" data-action="details">Details</button>
  <a class="cb-open" data-action="open">Open</a>
</div>
<div class="crate-rail late" aria-hidden="true"><span></span></div>
<p class="sr" id="announce" aria-live="polite"></p>
<section class="details" id="details" aria-label="Project details" tabindex="-1" inert>
  <h2 class="d-title"></h2>
  <p class="d-tag"></p>
</section>
<button class="d-play" id="d-play" type="button" aria-label="Play the film" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 2l14 8-14 8z" fill="currentColor"/></svg></button>
<div class="film-shade" id="film-shade"></div>
<div class="film-frame" id="film-frame"><video muted loop playsinline preload="auto"></video></div>
<button class="d-close" id="d-close" type="button" aria-label="Close the film" hidden>&#x2715;</button>
<a class="d-open" id="d-open" data-action="open" inert>Open</a>
<script type="module">
  // Without WebGL 2 (or if the scene fails to start) the shelf is plain cards.
  // The menu's marks load after the shelf's first frame (menu.js icons()); the static shelf has none, so at once.
  const at = window.__editionsSrc ? './' : './dist/';
  const menu = import(`${at}menu.js`).then(m => (m.start(), m));
  menu.catch(e => console.warn('menu', e));
  const icons = () => menu.then(m => m.icons(), () => {});
  const fallback = () => { icons(); return import(`${at}fallback.js`).then(m => m.start()); };
  if (!window.__editionsGL) fallback();
  else import(`${at}main.js`).then(m => { m.drawn.then(icons); }, e => { console.warn('shelf: static fallback', e); fallback(); });
</script>
</body>
</html>
